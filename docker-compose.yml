services:
  db:
    image: postgres:18-alpine
    container_name: ecom_merchant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom_merchant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom_merchant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ecom_pgdata:/var/lib/postgresql

volumes:
  ecom_pgdata:
