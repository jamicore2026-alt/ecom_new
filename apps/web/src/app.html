<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme')
					var dark =
						t === 'dark' ||
						(t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
					document.documentElement.dataset.theme = dark ? 'dark' : 'light'
				} catch (e) {}
				try {
					var m = document.cookie.match(/(?:^|;\s*)locale=([^;]+)/)
					var loc = m && (m[1] === 'ar' || m[1] === 'en') ? m[1] : 'en'
					document.documentElement.lang = loc
					document.documentElement.dir = loc === 'ar' ? 'rtl' : 'ltr'
				} catch (e) {}
			})()
		</script>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
