[project]
name = "ecom-new"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jamicore2026-alt", email = "jamicore2026@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ecom-new = "ecom_new:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.skylos]
# `client.ts` (apps/api/src/database/client.ts) is a server-only Postgres
# connection module. Skylos's client-context heuristic classifies any
# `client.*` basename as browser code and flags its use of DATABASE_URL as
# client-side secret exposure (SKY-S102). The module is imported only by
# server code and never bundled; exclude it rather than renaming across 79
# call sites.
exclude = ["client.ts"]

[tool.skylos.gate]
enabled = true
mode = "ci"
fail_on_critical = true
max_critical = 0
# Baseline inventory from `skylos . -a` (2026-09-10): 17 MEDIUM danger
# findings (SKY-D248 hardcoded local/dev URLs in config + SKY-D216 SSRF flags
# that are runtime-hardened via shared/outbound-url.ts and assertProxyOrigin).
# Thresholds are baseline + 1 so the gate blocks *new* findings, not the
# tracked, reviewed inventory.
max_high = 17
max_security = 21
max_ai_defects = 13
max_reliability = 0
max_quality = 300
max_secrets = 0
max_dependency_vulnerabilities = 0

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["graphify-out"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
