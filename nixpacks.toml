# Nixpacks build config for the Coolify/Nixpacks deploy.
#
# The default Bun shipped by the Nixpacks build image (1.1.x) cannot parse the
# text-based `bun.lock` (lockfileVersion: 1) produced by Bun 1.3+. When it
# ignores the lockfile it re-resolves from scratch and fails to link the local
# workspace package `@merchant-dashboard/api-proxy`, falling back to the npm
# registry and dying with a 404. To keep installs deterministic, install a
# modern Bun matching `packageManager` in package.json and run the frozen,
# lockfile-driven install with it.

[phases.setup]
nixPkgs = ["bun", "nodejs_22"]
cmds = [
  "...",
  "apt-get install -y unzip",
  "curl -fsSL https://bun.sh/install | bash -s \"bun-v1.3.14\"",
]

[phases.install]
cmds = [
  "export PATH=\"$HOME/.bun/bin:$PATH\" && bun --version && bun install --frozen-lockfile",
]
