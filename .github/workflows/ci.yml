name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecom_merchant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecom_merchant
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check (web)
        run: bun run check

      - name: Test
        run: bun run db:migrate && bun run db:seed && bun run test

      - name: Build
        run: bun run build

      - name: Deploy to Coolify
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # Trigger a Coolify deploy webhook with retries + exponential backoff.
          # A single transient 503 (Coolify busy/queuing) must not block the
          # remaining service webhooks, so all three are always attempted and
          # the step only fails if a webhook still fails after all retries.
          deploy_webhook() {
            local url="$1"
            local attempts=5
            for i in $(seq 1 "$attempts"); do
              if curl -fsS -X POST "$url" \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"; then
                echo "::notice:: Deploy triggered successfully"
                return 0
              fi
              local code=$?
              echo "attempt $i of $attempts failed (curl exit $code); retrying in $((i*5))s"
              sleep "$((i*5))"
            done
            echo "::error:: Deploy webhook failed after $attempts attempts"
            return 1
          }

          fail=0
          deploy_webhook "${{ secrets.COOLIFY_WEBHOOK_URL }}" || fail=1
          deploy_webhook "${{ secrets.COOLIFY_WEBHOOK_URL_MERCHANT }}" || fail=1
          deploy_webhook "${{ secrets.COOLIFY_WEBHOOK_URL_STORE }}" || fail=1
          exit "$fail"
          
